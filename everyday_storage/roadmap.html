<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Roadmap for Everyday Filetrap.">
  <title>Everyday Filetrap | Roadmap</title>
  <link rel="icon" type="image/png" href="../images/icons/everyday_storage.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #18110d;
      --line: rgba(255, 243, 229, 0.12);
      --text: #f8efe3;
      --muted: rgba(248, 239, 227, 0.72);
      --amber: #e0be86;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #17110d 0%, #201510 48%, #130d09 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    a { color: inherit; text-decoration: none; }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 2.5rem;
    }

    .brand img {
      width: 52px;
      height: 52px;
      border-radius: 14px;
    }

    .brand-name {
      font-size: 0.97rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--amber);
    }

    h1 {
      margin: 0 0 1rem;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    p {
      margin: 0 0 2rem;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 34rem;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.75rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 700;
      background: rgba(255, 247, 238, 0.06);
      transition: background 0.2s ease;
    }

    .back:hover {
      background: rgba(255, 247, 238, 0.12);
    }
  </style>
</head>
<body>
  <a class="brand" href="index.html">
    <img src="../images/icons/everyday_storage.png" alt="Everyday Filetrap icon">
    <span class="brand-name">Everyday Filetrap</span>
  </a>

  <h1>Still in development.</h1>
  <p>The roadmap is being worked on. Check back soon for updates on what's coming next.</p>

  <a class="back" href="index.html">← Back to product page</a>
</body>
</html>
